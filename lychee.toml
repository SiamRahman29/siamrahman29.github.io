# Lychee link checker config.
# Docs: https://lychee.cli.rs/usage/config/

# Don't follow rate-limit-prone external sites. These either rate-limit or
# actively block bot checks; failing the build on them is noise.
exclude = [
  # Placeholder / TBD links (will be filled in pre-launch).
  '^https://cal\.com/.*',
  # Sites that 403/999 on bot checks regardless of validity.
  '^https://(www\.)?linkedin\.com/.*',
  '^https://(www\.)?x\.com/.*',
  '^https://(www\.)?twitter\.com/.*',
  # Skip external HTTP checks against our own domain. Local file links are
  # already validated by --root-dir on the dist scan; checking the
  # self-domain over the network on every push is a chicken-and-egg trap
  # (the build that publishes the site is the same build that would have
  # tried to fetch the not-yet-published URLs).
  '^https://siamrahman29\.github\.io',
  # External marketing sites we don't own (placeholders).
  '^https://askturing\.ai/?$',
  '^https://grab\.com/?$',
]

# Accept these status codes as OK. Several services intermittently rate-limit.
accept = [200, 204, 206, 301, 302, 304, 403, 429]

# Don't fail when no inputs match (e.g. no anchors).
no_progress = true

# Reasonable network defaults.
max_concurrency = 8
timeout = 20
retry_wait_time = 5
max_retries = 2

# Respect robots.
user_agent = "lychee/0.23 (+https://lychee.cli.rs)"
